services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLMLL_LANGUAGETOOL_URL: http://languagetool:8010
    volumes:
      - llmll-data:/data
    depends_on:
      - languagetool
    restart: unless-stopped

  languagetool:
    image: erikvl87/languagetool:latest
    environment:
      Java_Xms: 512m
      Java_Xmx: 1g
    restart: unless-stopped

  # Optional HTTPS reverse proxy (see "Deploying on a server" in README.md).
  # caddy:
  #   image: caddy:2
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   depends_on:
  #     - app
  #   restart: unless-stopped

volumes:
  llmll-data:
  # caddy-data:
