[project]
name = "llmll-backend"
version = "0.1.0"
description = "LLMLL backend (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings",
    "fsrs>=6.3.2",
    "pyyaml>=6.0.3",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
