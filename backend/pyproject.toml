[project]
name = "llmll-backend"
version = "0.1.0"
description = "LLMLL backend (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings",
    "fsrs>=6.3.2",
    "pyyaml>=6.0.3",
    "wordfreq>=3.1.1",
    "anthropic>=1.11.0",
    "httpx>=0.28.1",
    "spacy>=3.8.16",
    "trafilatura>=2.3.0",
    "de-core-news-md",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spacy: needs the de_core_news_md model (skipped when it is not installed)"]

[tool.uv.sources]
de-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl" }
