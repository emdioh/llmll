# Grader evaluation cases: multi_error. Hand-reviewed; see evals/README.md.
- id: mul-01
  category: multi_error
  level: A2
  exercise:
    type: translation
    instructions: Traduci in tedesco.
    prompt: Ieri sono andato con il mio amico al cinema.
    reference_solutions:
    - Gestern bin ich mit meinem Freund ins Kino gegangen.
    targets:
    - item_id: gram:perfekt
    - item_id: gram:prepositions-dat
  answer: Gestern habe ich mit meinen Freund ins Kino gegangen.
  expected:
    overall: major_errors
    errors:
    - item_id: gram:perfekt
      diagnostic_tags:
      - wrong-auxiliary
      severity: major
      span_text: habe
    - item_id: gram:prepositions-dat
      diagnostic_tags:
      - accusative-instead-of-dative
      severity: major
      span_text: meinen
    correct_uses: []
  notes: ""
