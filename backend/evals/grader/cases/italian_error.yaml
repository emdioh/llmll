- id: ita-01
  category: italian_error
  level: A1
  exercise:
    type: translation
    instructions: Traduci in tedesco.
    prompt: Il tavolo è grande.
    reference_solutions:
    - Der Tisch ist groß.
    targets:
    - item_id: gram:articles-nom-akk
    - item_id: lex:tisch
  answer: Die Tisch ist groß.
  expected:
    overall: major_errors
    errors:
