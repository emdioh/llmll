# Grader evaluation cases: correct_variant. Hand-reviewed; see evals/README.md.
- id: var-01
  category: correct_variant
  level: A1
  exercise:
    type: translation
    instructions: Traduci in tedesco.
    prompt: Domani vado a Roma in treno.
    reference_solutions:
    - Morgen fahre ich mit dem Zug nach Rom.
    targets:
    - item_id: gram:prepositions-dat
    - item_id: lex:fahren
  answer: Ich fahre morgen mit dem Zug nach Rom.
  expected:
    overall: correct
    errors: []
    correct_uses:
    - gram:prepositions-dat
    - lex:fahren
  notes: Subject first instead of the fronted adverb.
