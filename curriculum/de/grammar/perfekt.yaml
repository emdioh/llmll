  - {de: "Ich habe gestern Pizza gegessen.", it: "Ieri ho mangiato la pizza."}
  - {de: "Wir sind nach Berlin gefahren.", it: "Siamo andati a Berlino."}
  - {de: "Er hat seine Mutter angerufen.", it: "Ha telefonato a sua madre."}
